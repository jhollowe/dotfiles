###########################
# General
###########################

# improve colors
set -g default-terminal 'screen-256color'


# increase scrollback lines
set -g history-limit 10000

set -g status-interval 5

###########################
# Controls
###########################


# change prefix to Ctrl+Space
unbind C-b
set -g prefix C-Space

# set prefix2 to Ctrl+b for backwards compatibility
set -g prefix2 C-b

# sort the session list by name (and allow direct access via double Ctrl+Space)
bind s choose-tree -wZ -O name
bind C-Space choose-tree -wZ -O name

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# switch windows with prefix Alt-arrow
bind M-Up select-window -p
bind M-Down select-window -n
bind M-Left select-window -l

# join other window as horizontal pane to current window
bind j choose-window "join-pane -h -s '%%'"

# run 'incognito' in all panes of the current window
# bind i run-shell "tmux list-panes -F '#{pane_id}' | xargs -I{} tmux send-keys -t {} 'incognito' Enter"

###########################
# Window
###########################

# start window index at 1
set -g base-index 1

# renumber windows sequentially after closing any of them
setw -g renumber-windows on


###########################
# Pane
###########################

# start pane index at 1
setw -g pane-base-index 1


###########################
# Status Bar
###########################

# enable UTF-8 support in status bar
# set -g status-utf8 on

# soften status bar color from harsh green to light gray
set -g status-style bg='#666666',fg='#aaaaaa'

# show hostname, date, time
set -g status-right '#H %Y-%m-%d %I:%M'


###########################
# Local Overrides
###########################

if-shell "[ -f ~/.tmux_local.conf ]" 'source ~/.tmux_local.conf'
